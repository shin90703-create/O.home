<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>ASHLINE · 관전</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b141b;color:#abc2ca;font:12px system-ui}body{display:flex;flex-direction:column}header{padding:5px 12px;background:#101d26}iframe{border:0;flex:1;width:100%;min-height:0}</style></head><body><header id="status" role="status">관전 기록을 불러오는 중…</header><iframe id="frame" title="애시라인 관전" sandbox="allow-scripts" hidden></iframe><script>
'use strict';
const params=new URLSearchParams(location.hash.slice(1)),bucket=params.get('b')||'',id=params.get('i')||'',secret=params.get('k')||'';
const frame=document.getElementById('frame'),statusLine=document.getElementById('status');
let revision=-1,busy=false,ready=false,latest;
function deliver(){if(ready&&latest){frame.contentWindow.postMessage({type:'ASHLINE_WATCH_STATE',game:latest.game,revision},'*');frame.hidden=false}}
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='ASHLINE_WATCH_READY'){ready=true;deliver()}});
async function start() {
  if(!/^[a-z0-9.-]{3,222}$/.test(bucket)||!/^[a-f0-9]{32}$/.test(id)||!/^[a-f0-9]{64}$/.test(secret))throw Error();
  const key=await crypto.subtle.importKey('raw',Uint8Array.from(secret.match(/../g),s=>parseInt(s,16)),'AES-GCM',false,['decrypt']);
  const template = await fetch('/ashline/index.html').then(r=>{if(!r.ok)throw Error();return r.text()});
  const parsed=new DOMParser().parseFromString(template,'text/html');
  const nonce=Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,'0')).join('');
  const csp=parsed.createElement('meta');csp.httpEquiv='Content-Security-Policy';
  csp.content="default-src 'none'; script-src 'nonce-"+nonce+"'; style-src 'unsafe-inline' https://fonts.googleapis.com "+location.origin+"; font-src https://fonts.gstatic.com data:; img-src data: blob: https:; connect-src https://api.open-meteo.com; frame-src 'none'; form-action 'none'; base-uri 'none'";
  parsed.head.prepend(csp);
  for(const script of parsed.querySelectorAll('script'))script.nonce=nonce;
  for(const name of ['lore','observer']){
    const script=parsed.createElement('script');
    script.nonce=nonce;script.src=location.origin+'/ashline/'+name+'.js';parsed.body.append(script);
  }
  const css=parsed.createElement('link');css.rel='stylesheet';css.href=location.origin+'/ashline/scroll.css';parsed.head.append(css);
  frame.srcdoc='<!doctype html>'+parsed.documentElement.outerHTML;
  async function readView() {
    const path=encodeURIComponent('ohome/spectators/'+id+'/public.bin');
    const url='https://firebasestorage.googleapis.com/v0/b/'+encodeURIComponent(bucket)+'/o/'+path+'?alt=media';
    const response=await fetch(url,{cache:'no-store',credentials:'omit'});
    if(response.status===404)return null;
    if(!response.ok)throw Error();
    const bytes=new Uint8Array(await response.arrayBuffer());
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function refresh() {
    if(busy||document.hidden)return;busy=true;
    try {
      const current=await readView();if(current?.schema!==2||!current.game)throw Error();
      if(current.revision>revision){latest=current;revision=current.revision;deliver()}
      statusLine.textContent='관전 · 읽기 전용';
    } catch {statusLine.textContent=revision<0?'관전 자료 대기 중 · 생존자가 업데이트된 애시라인에 접속하면 표시돼.':'연결이 끊겼어. 잠시 뒤 다시 확인할게.'}
    finally{busy=false}
  }
  await refresh();setInterval(refresh,15000);document.addEventListener('visibilitychange',refresh);
}
start().catch(()=>{statusLine.textContent='관전 링크가 완전하지 않아. 공유받은 주소 전체를 열어 줘.'});
</script></body></html>
