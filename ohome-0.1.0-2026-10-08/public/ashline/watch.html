<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>ASHLINE · 관전</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b141b;color:#d6e5e8;font:15px/1.65 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:clamp(20px,5vw,52px)}h1{font:clamp(26px,5vw,39px) Georgia,serif;letter-spacing:.1em;margin:0}h1 small{font:13px system-ui;color:#91b6b7;letter-spacing:.04em}h2{font-size:17px;color:#b2dedd;margin:28px 0 10px}h3{font-size:16px;margin:0}section,details{background:#111f28;border:1px solid #30444b;padding:15px 18px}details+details{border-top:0}summary{cursor:pointer;color:#c6e1e0;overflow-wrap:anywhere}p{margin:6px 0}article{padding:12px 0 0;margin-top:12px;border-top:1px solid #294048}article p{white-space:pre-wrap;overflow-wrap:anywhere}small,#status{font-size:12px;color:#9fb4b9}time{font-size:12px;margin-left:8px;color:#9fb4b9}
</style></head><body><main><h1>ASHLINE <small>관전</small></h1><p id="status" role="status">관전 기록을 불러오는 중…</p><div id="view" hidden><h2>거점</h2><section><h3 id="base"></h3><p id="gear"></p></section><h2>역극</h2><div id="rooms"></div></div></main><script>
'use strict';
const params = new URLSearchParams(location.hash.slice(1));
const bucket=params.get('b')||'', id=params.get('i')||'', secret=params.get('k')||'';
const statusLine=document.getElementById('status'), rooms=document.getElementById('rooms');
let revision=-1, busy=false;
function element(tag, value) {const node=document.createElement(tag);node.textContent=value;return node}
function show(data) {
  const opened=new Set(Array.from(rooms.querySelectorAll('details[open]'), el=>el.dataset.room));
  document.getElementById('base').textContent=data.base;
  document.getElementById('gear').textContent=data.equipment.join(' · ')||'아직 설치한 설비가 없어.';
  const list=document.createDocumentFragment();
  for(const room of data.rooms) {
    const row=document.createElement('details');row.dataset.room=room.id;row.open=opened.has(room.id);
    row.append(element('summary',room.title+' · '+room.messages.length+'개'));
    for(const m of room.messages) {
      const post=document.createElement('article');post.append(element('strong',m.name),element('time',m.time),element('p',m.text));row.append(post);
    }
    if(!room.messages.length)row.append(element('p','아직 작성된 글이 없어.'));
    list.append(row);
  }
  if(!data.rooms.length)list.append(element('p','아직 등록된 역극이 없어.'));
  rooms.replaceChildren(list);document.getElementById('view').hidden=false;
}
async function start() {
  if(!/^[a-z0-9.-]{3,222}$/.test(bucket)||!/^[a-f0-9]{32}$/.test(id)||!/^[a-f0-9]{64}$/.test(secret))throw Error();
  const key=await crypto.subtle.importKey('raw',Uint8Array.from(secret.match(/../g),s=>parseInt(s,16)),'AES-GCM',false,['decrypt']);
  async function lane(slot) {
    const path=encodeURIComponent('ohome/spectators/'+id+'/'+slot+'.bin');
    const url='https://firebasestorage.googleapis.com/v0/b/'+encodeURIComponent(bucket)+'/o/'+path+'?alt=media';
    const response=await fetch(url,{cache:'no-store',credentials:'omit'});
    if(response.status===404)return null;
    if(!response.ok)throw Error();
    const bytes=new Uint8Array(await response.arrayBuffer());
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function refresh() {
    if(busy||document.hidden)return;busy=true;
    try {
      const results=await Promise.allSettled(['A','B'].map(lane));
      const rows=results.flatMap(r=>r.status==='fulfilled'&&r.value?[r.value]:[]).sort((a,b)=>b.revision-a.revision);
      const current=rows[0];if(!current)throw Error();
      if(current.revision>revision){show(current);revision=current.revision}
      statusLine.textContent='읽기 전용 · 15초마다 새 기록을 확인해.';
    } catch {statusLine.textContent=revision<0?'기록을 열 수 없어. 공유받은 링크를 확인해 줘.':'연결이 끊겼어. 잠시 뒤 다시 확인할게.'}
    finally{busy=false}
  }
  await refresh();setInterval(refresh,15000);document.addEventListener('visibilitychange',refresh);
}
start().catch(()=>{statusLine.textContent='관전 링크가 완전하지 않아. 공유받은 주소 전체를 열어 줘.'});
</script></body></html>
